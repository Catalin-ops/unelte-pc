plugins { id 'com.android.application' }
android {
    namespace 'ro.infopc.scanareretea'
    compileSdk 34
    defaultConfig {
        applicationId 'ro.infopc.scanareretea'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'txt' }
}
